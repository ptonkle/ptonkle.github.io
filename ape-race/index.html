<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. A meta policy cannot stop data
       leaving by navigation, so the browser check still watches requests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://nos.lol wss://relay.mostr.pub wss://purplerelay.com wss://nostr.data.haus wss://relay.agorist.space; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ape Race</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false" data-screen="">
  <canvas id="view"></canvas>

  <section id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="pair" id="hud-place"><span class="k"></span><span class="v"></span></div>
      <div class="pair" id="hud-time"><span class="k"></span><span class="v"></span></div>
      <div class="pair" id="hud-best"><span class="k"></span><span class="v"></span></div>
    </div>
    <div class="item-slot" id="hud-item"><span class="k"></span><span class="v"></span></div>
    <div class="big" id="hud-big"></div>
    <div class="hint" id="hud-hint"></div>
    <div class="reticle" id="hud-reticle"></div>
    <canvas id="minimap" class="minimap"></canvas>
    <div id="speedo" class="speedo hype-0">
      <!-- the face and the banana come from the core as SVG markup -->
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g id="speedo-face"></g>
        <g id="speedo-needle" class="needle"></g>
        <circle cx="100" cy="100" r="11" class="hub"/>
      </svg>
      <div class="speedo-read"><span id="speedo-value">0</span><span id="speedo-unit"></span></div>
      <div id="speedo-shout" class="shout"></div>
    </div>
  </section>

  <main id="menus" class="menus"></main>
  <p id="message" class="message" role="status"></p>

  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
